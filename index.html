<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevMarks · 미니멀 테크 북마크</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="header">
      <div class="header-badge">
        <span class="pulse-dot"></span>
        Curated Tech Archive
      </div>
      <h1 class="site-title">DevMarks</h1>
      <p class="site-description">엄선된 개발, 디자인, 생산성 도구와 아티클을 모아둔 아카이브입니다.</p>

      <!-- Search Bar -->
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="search-input" 
          placeholder="키워드, 태그, 제목 검색..." 
          autocomplete="off"
          spellcheck="false"
        >
        <button type="button" id="search-clear" class="search-clear hidden" aria-label="검색어 초기화">✕</button>
      </div>
    </header>

    <!-- Dynamic Category Filter Chips -->
    <nav class="category-section" aria-label="카테고리 필터">
      <div class="category-chips" id="category-chips">
        <!-- app.js에서 JSON 데이터를 바탕으로 동적 생성됩니다 -->
      </div>
    </nav>

    <!-- Main Content Grid -->
    <main class="main-content">
      <!-- Status & Empty state -->
      <div id="status-box" class="status-box">
        <div class="spinner"></div>
        <p class="status-text">북마크 데이터를 로드하는 중입니다...</p>
      </div>

      <!-- Bookmarks Grid -->
      <section id="bookmarks-grid" class="bookmarks-grid" aria-live="polite">
        <!-- app.js를 통해 카드가 렌더링됩니다 -->
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-inner">
        <span>DevMarks Archive</span>
        <span class="divider">/</span>
        <span>HTML · CSS · Vanilla JS</span>
      </div>
    </footer>
  </div>
</body>
</html>
